<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extração de Docs-KM_1.1</title>
    <meta name="description" content="Leitura multimodal de documentos e manuscritos, extração estruturada de dados, tabela de validação interativa e exportação em CSV com UTF-8 BOM." />
    <meta property="og:title" content="Extração de Docs-KM_1.1" />
    <meta property="og:description" content="Leitura multimodal de documentos e manuscritos, extração estruturada de dados, tabela de validação interativa e exportação em CSV com UTF-8 BOM." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-stone-100 dark:bg-stone-950 text-stone-900 dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
